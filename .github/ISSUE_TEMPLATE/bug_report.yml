name: Bug report
description: Report a reproducible problem in RepoTower.
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: 0.5.0, Windows 11 x64, single EXE
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small public example. Do not attach private source code or runtime profiles.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
