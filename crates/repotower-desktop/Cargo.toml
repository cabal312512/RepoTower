[package]
name = "repotower-desktop"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native offline dependency explorer"

[[bin]]
name = "RepoTower"
path = "src/main.rs"

[dependencies]
repotower-core = { path = "../repotower-core" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
tempfile = "3"
