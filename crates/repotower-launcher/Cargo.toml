[package]
name = "repotower-launcher"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Project-local self-extracting Windows launcher for RepoTower"

[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11"
crc32fast = "1.5"

[dev-dependencies]
tempfile = "3"
