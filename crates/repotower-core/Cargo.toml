[package]
name = "repotower-core"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Offline multi-language dependency analysis and potential-impact simulation for RepoTower"

[dependencies]
ignore = "0.4"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
